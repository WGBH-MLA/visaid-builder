[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "visaid-builder"
version = "1.99.0"
description = "Routines for processing MMIF files to create visual indexes ('visaids') and other useful output."
readme = "README.md"
license = "MIT"
dependencies = [
    "av>=12.0.0",
    "pillow>=10.3.0",
    "mmif-python>=1.1.2",
    "titlecase>=2",
    "tomli; python_version < '3.11'"
]

[project.scripts]
visswt = "visaid_builder.use_swt:main"
catdoor = "visaid_builder.catdoor.door:main"

[project.urls]
"Homepage" = "https://github.com/WGBH-MLA/visaid_builder"
"Source" = "https://github.com/WGBH-MLA/visaid_builder"

